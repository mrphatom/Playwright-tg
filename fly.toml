app = "playwright-tg-mrphatom"

primary_region = "iad"



[build]

  dockerfile = "Dockerfile"
  


[env]

  DB_PATH = "/data/telescout.db"
  
  MAX_CONCURRENT_TASKS = "3"
  
  COMMAND_TIMEOUT = "90"
  GEMINI_MODEL = "gemini-3.6-flash"
  TEXT_FALLBACK_MODEL = "gemini-3.5-flash-lite"
  MULTIMODAL_MODEL = "gemini-3.5-flash-lite"
  GOOGLE_CUSTOM_SEARCH_ENABLED = "false"
  GOOGLE_CUSTOM_SEARCH_TIMEOUT_SECONDS = "8"
  GOOGLE_CUSTOM_SEARCH_RESULTS = "5"
  PROVIDER_ALERTS_ENABLED = "true"
  PROVIDER_ALERT_COOLDOWN_SECONDS = "900"
  NOTIFICATION_WORKER_ENABLED = "true"
  BULK_ACTIONS_ENABLED = "true"
  DEVELOPER_EVENTS_ENABLED = "true"
  MAX_BULK_TARGETS = "200"
  NOTIFICATION_POLL_SECONDS = "5"
  ROLE_MESSAGING_ENABLED = "true"
  MAINTENANCE_FEATURE_ENABLED = "true"
  MAINTENANCE_SCHEDULER_POLL_SECONDS = "15"
  CRASH_FAILSAFE_ENABLED = "true"
  QUEUE_ENABLED = "true"
  QUEUE_MAX_DEPTH = "100"
  QUEUE_POLL_SECONDS = "1"
  QUEUE_ETA_FLOOR_SECONDS = "5"
  INLINE_ENABLED = "true"
  GROUP_INVOCATION_ENABLED = "true"
  BUSINESS_MODE_ENABLED = "true"
  CHANNEL_INVOCATION_ENABLED = "true"
  INLINE_TIMEOUT_SECONDS = "8"
  CHAT_CONTEXT_TURNS = "32"
  MEDIA_TIMEOUT_SECONDS = "45"
  
  PUBLIC_MODE = "true"
  ALLOWED_DOMAINS = "github.com,amazon.com,news.ycombinator.com,google.com,coinmarketcap.com,duckduckgo.com,bing.com,brave.com,startpage.com,x.com,reddit.com"
  DASHBOARD_BASE_URL = "https://playwright-tg-mrphatom.fly.dev"
  PORT = "8080"
  


[[mounts]]

  source = "telescout_data"
  
  destination = "/data"
  


[vm]

  memory = "2048mb"
  
  cpu_kind = "shared"
  
  cpus = 1
  


[[restart]]

  policy = "always"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"
  











