name: Deploy to Fly.io



on:

  workflow_dispatch:
  
  push:
  
    branches: ["main"]
    


jobs:

  deploy:
  
    runs-on: ubuntu-latest
    
    permissions:
    
      contents: read
      


    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Set up Fly CLI
      
        uses: superfly/flyctl-actions/setup-flyctl@master
        


      - name: Log in to Fly registry
      
        uses: docker/login-action@v3
        
        with:
        
          registry: registry.fly.io
          
          username: x
          
          password: ${{ secrets.FLY_API_TOKEN }}
          


      - name: Build and push image
      
        uses: docker/build-push-action@v6
        
        with:
        
          context: .
          
          file: ./Dockerfile
          
          push: true
          
          tags: registry.fly.io/playwright-tg-mrphatom:main
          


      - name: Deploy image to Fly.io
      
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
        run: flyctl deploy --config fly.toml --app playwright-tg-mrphatom --image registry.fly.io/playwright-tg-mrphatom:main --yes

      - name: Ensure public IPv4 for dashboard hostname
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl ips list --app playwright-tg-mrphatom | grep -Eq '[[:space:]]v4[[:space:]]'; then
            echo "Fly public IPv4 already allocated"
          else
            flyctl ips allocate-v4 --shared --app playwright-tg-mrphatom
          fi
        





























