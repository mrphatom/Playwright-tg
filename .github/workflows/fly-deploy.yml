name: Deploy to Fly.io



on:

  workflow_dispatch:
  
  push:
  
    branches: ["main"]
    


jobs:

  deploy:
  
    runs-on: ubuntu-latest
    
    permissions:
    
      contents: read
      


    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run regression suite
        run: pytest test_bot.py test_platform.py test_dashboard.py test_pairing.py test_discord_automations.py test_platform_contracts.py -q

      - name: Set up Fly CLI
      
        uses: superfly/flyctl-actions/setup-flyctl@master
        


      - name: Log in to Fly registry
      
        uses: docker/login-action@v3
        
        with:
        
          registry: registry.fly.io
          
          username: x
          
          password: ${{ secrets.FLY_API_TOKEN }}
          


      - name: Build and push image
      
        uses: docker/build-push-action@v6
        
        with:
        
          context: .
          
          file: ./Dockerfile
          
          push: true
          
          tags: registry.fly.io/playwright-tg-mrphatom:main
          


      - name: Deploy image to Fly.io
      
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          
        run: |
          for attempt in 1 2 3; do
            echo "Fly.io deploy attempt ${attempt}/3"
            if flyctl deploy --config fly.toml --app playwright-tg-mrphatom --image registry.fly.io/playwright-tg-mrphatom:main --yes; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "Fly.io deployment failed after 3 attempts" >&2
          exit 1

      - name: Configure dedicated API-key hashing secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          API_KEY_HASH_SECRET: ${{ secrets.API_KEY_HASH_SECRET }}
        run: |
          test -n "$API_KEY_HASH_SECRET"
          for attempt in 1 2 3; do
            echo "API key secret configuration attempt ${attempt}/3"
            if flyctl secrets set API_KEY_HASH_SECRET="$API_KEY_HASH_SECRET" --app playwright-tg-mrphatom; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "API key secret configuration failed after 3 attempts" >&2
          exit 1

      - name: Configure Gemini fallback secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          test -n "$GEMINI_API_KEY_2"
          test -n "$GEMINI_API_KEY_3"
          test -n "$GEMINI_API_KEY_4"
          for attempt in 1 2 3; do
            echo "Gemini fallback secret configuration attempt ${attempt}/3"
            if flyctl secrets set GEMINI_API_KEY_2="$GEMINI_API_KEY_2" GEMINI_API_KEY_3="$GEMINI_API_KEY_3" GEMINI_API_KEY_4="$GEMINI_API_KEY_4" --app playwright-tg-mrphatom; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "Gemini fallback secret configuration failed after 3 attempts" >&2
          exit 1

      - name: Ensure public IPv4 for dashboard hostname
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl ips list --app playwright-tg-mrphatom | grep -Eq '[[:space:]]v4[[:space:]]'; then
            echo "Fly public IPv4 already allocated"
          else
            flyctl ips allocate-v4 --shared --app playwright-tg-mrphatom
          fi
        





























