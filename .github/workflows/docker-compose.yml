version: '3.8'

services:
  bot:
    image: ghcr.io/mrphatom/playwright-tg:main
    container_name: telescout-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount SQLite database file to host so DB persists across image pulls
      - ./telescout.db:/app/telescout.db
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
